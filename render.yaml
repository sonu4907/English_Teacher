services:
  - type: web
    name: verbaai
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: verbaai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"

databases:
  - name: verbaai-db
    databaseName: verbaai
    user: verbaai_user
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
